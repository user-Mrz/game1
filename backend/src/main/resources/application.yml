server:
  port: 8080

spring:
  application:
    name: ink-game-backend
  datasource:
    url: jdbc:sqlite:./data/game.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info